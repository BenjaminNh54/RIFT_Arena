<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="description" content="RIFT ARENA — jeu navigateur multijoueur par TB_games">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <title>RIFT ARENA</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/lobby.css">
  <link rel="stylesheet" href="/styles/screens.css">
  <link rel="stylesheet" href="/styles/auth.css">
  <link rel="stylesheet" href="/styles/game.css">
  <link rel="stylesheet" href="/styles/admin.css">
  <link rel="stylesheet" href="/styles/mobile.css">
  <link rel="stylesheet" href="/styles/compact.css">
</head>
<body>
  <div id="app"></div>
  <div id="overlays"></div>
  <div id="toasts"></div>
  <div id="rotate-hint" class="hidden" aria-hidden="true">
    <div class="rh-box">
      <svg viewBox="0 0 24 24" class="rh-ic" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="2.5" width="8" height="16" rx="1.8"/>
        <path d="M10.5 16h3"/>
        <path d="M3.5 9.5a9 9 0 0 1 3.2-5.2"/>
        <path d="M4.6 2.6 6.7 4.3 4 5.4z" fill="currentColor" stroke="none"/>
        <path d="M20.5 14.5a9 9 0 0 1-3.2 5.2"/>
        <path d="M19.4 21.4 17.3 19.7 20 18.6z" fill="currentColor" stroke="none"/>
      </svg>
      <h3>TOURNE TON TÉLÉPHONE</h3>
      <p>RIFT ARENA se joue à l'horizontale : arène plus visible, HUD complet, joystick confortable.</p>
      <button id="rotate-dismiss" class="btn ghost small">Continuer en vertical</button>
    </div>
  </div>
  <script type="module" src="/src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
